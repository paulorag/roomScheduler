spring.application.name=scheduler

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/rooms_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

app.admin.email=${ADMIN_EMAIL:admin@room.com}
app.admin.password=${ADMIN_PASSWORD:Admin@12345}
app.admin.name=${ADMIN_NAME:Administrador}

api.security.token.secret=${JWT_SECRET:minha-chave-secreta-padrao-local}

cors.allowed.origins=${CORS_ORIGINS:http://localhost:3000,https://room-scheduler-gold.vercel.app,https://*.vercel.app,https://*.onrender.com}